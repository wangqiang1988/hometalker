services:
  caddy:
    image: caddy:2-alpine
    container_name: footalker-caddy
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDR: "${SITE_ADDR:?请在 .env 中设置 SITE_ADDR}"
      PORT: "${PORT:-8443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: footalker-server
    restart: unless-stopped
    environment:
      PORT: "${PORT:-8443}"
      FAMILY_CODE: "${FAMILY_CODE:?请在 .env 中设置 FAMILY_CODE}"
      ROOM_NAME: "${ROOM_NAME:-home}"
      MAX_MEMBERS: "${MAX_MEMBERS:-12}"
      MAX_SPEAK_MS: "${MAX_SPEAK_MS:-60000}"
      SPEAK_MODE: "${SPEAK_MODE:-preempt}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    expose:
      - "${PORT:-8443}"

volumes:
  caddy_data:
  caddy_config:
